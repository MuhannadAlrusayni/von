[project]
name = "von"
version = "1.0.0"
description = "Von - The open-source System One decision model. Sub-15ms, local, non-autoregressive decision primitives in homage to John von Neumann and Ludwig von Mises."
authors = [
    { name = "Victor Hugo", email = "victor.panisa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cactus-needle>=3.0.1",
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
von = "von.cli:main"

[project.optional-dependencies]
all = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "gliclass>=0.1.20",
    "onnxruntime>=1.17.0",
    "laya>=0.1.6",
]


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
