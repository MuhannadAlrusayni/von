[project]
name = "von"
version = "1.0.0"
description = "Von - The open-source System One decision model. Sub-15ms, local, non-autoregressive decision primitives in homage to John von Neumann and Ludwig von Mises."
authors = [
    { name = "Victor Hugo", email = "victor.panisa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "accelerate>=0.26.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
von = "von.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
