[project]
name = "hop"
version = "1.0.0"
description = "Hop - The open-source System One decision engine. Sub-15ms, local, non-autoregressive decision primitives."
authors = [
    { name = "Victor Hugo", email = "victor.panisa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cactus-needle>=3.0.1",
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
hop = "hop.cli:main"


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
