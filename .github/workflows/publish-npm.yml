name: Publish to npm

# Ships the JS SDK in js/ to npm as von-sdk, kept in version lockstep with the
# Python SDK so a given tag means the same release on both registries.
#
# Auth is PyPI-style Trusted Publishing: npm exchanges the workflow's OIDC
# identity for a short-lived token, so there is no NPM_TOKEN to store, leak or
# rotate. It also gets provenance attestations for free.
#
# Configure once at npmjs.com -> von-sdk -> Settings -> Trusted Publisher:
#   Organization or user: wfzyx
#   Repository:           von
#   Workflow filename:    publish-npm.yml
# Called by cut-release.yml; see publish-pypi.yml for why this is not
# tag-triggered on its own.
on:
  workflow_call:
    inputs:
      version:
        description: "Version being released; must equal js/package.json"
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: js

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The SDK's build and test scripts are bun-based; npm is kept only for the
      # publish step, which is what performs the OIDC exchange.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify requested version matches package version
        if: inputs.version != ''
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          echo "requested=${{ inputs.version }} package=$PKG"
          if [ "${{ inputs.version }}" != "$PKG" ]; then
            echo "::error::Requested ${{ inputs.version }} but js/package.json is $PKG."
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: check
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          if npm view "von-sdk@$PKG" version >/dev/null 2>&1; then
            echo "::warning::von-sdk $PKG is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Publish
        # npm >= 11.5.1 performs the OIDC exchange itself when id-token: write
        # is set; no NODE_AUTH_TOKEN is needed or wanted.
        if: steps.check.outputs.skip == 'false' && inputs.dry_run == false
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm publish --access public
